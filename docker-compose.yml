version: '3.8'

services:
  # Base de datos MySQL con collation utf8mb4_unicode_ci
  db:
    image: mysql:8.0
    container_name: tours_micaela_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2024
      MYSQL_DATABASE: micaela
      MYSQL_USER: micaela_user
      MYSQL_PASSWORD: micaela_pass_2024
      TZ: America/Lima
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup:/backup
    networks:
      - tours_network
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --init-connect='SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci'
      --max_connections=200
      --innodb_buffer_pool_size=512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_2024"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Aplicación PHP/Apache
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tours_micaela_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      # Persistencia de archivos generados
      - ./greenter/xml:/var/www/html/greenter/xml
      - ./greenter/cdr:/var/www/html/greenter/cdr
      - ./greenter/pdf:/var/www/html/greenter/pdf
      - ./greenter/certificados:/var/www/html/greenter/certificados
      - ./Fotos:/var/www/html/Fotos
      - ./controller/usuario/fotos:/var/www/html/controller/usuario/fotos
      - ./controller/choferes/fotos:/var/www/html/controller/choferes/fotos
      - ./controller/empresa/FOTOS:/var/www/html/controller/empresa/FOTOS
      - ./backup:/var/www/html/backup
      # Sesiones PHP persistentes
      - sessions_data:/tmp/sessions
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - TZ=America/Lima
      # Variables de conexión a BD
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=micaela
      - DB_USER=micaela_user
      - DB_PASSWORD=micaela_pass_2024
    networks:
      - tours_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # phpMyAdmin para gestión de BD
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: tours_micaela_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password_2024
      UPLOAD_LIMIT: 100M
      MEMORY_LIMIT: 512M
      MAX_EXECUTION_TIME: 600
    networks:
      - tours_network

networks:
  tours_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  sessions_data:
    driver: local
